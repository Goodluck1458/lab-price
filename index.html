<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รายการตรวจสุขภาพ - คำนวณราคา</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1d2733;--mute:#6b7a8c;--pri:#1565c0;--line:#dde4ee;--hl:#fff8c5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a24;--card:#1b2633;--tx:#e8eef5;--mute:#93a3b5;--pri:#5aa2f0;--line:#2c3a4b;--hl:#4a4520}}
:root[data-theme="dark"]{--bg:#121a24;--card:#1b2633;--tx:#e8eef5;--mute:#93a3b5;--pri:#5aa2f0;--line:#2c3a4b;--hl:#4a4520}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;font-family:Sarabun,"Noto Sans Thai",Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
header{background:var(--pri);color:#fff;padding:16px 20px}
header h1{margin:0;font-size:1.4rem}
.wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;max-width:1200px;margin:16px auto;padding:0 12px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.side input[type=text]{width:100%;margin:6px 0 10px}
input[type=search],input[type=text]{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;padding:9px 14px;border:0;border-radius:8px;cursor:pointer;background:var(--pri);color:#fff}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
h2{font-size:1.05rem;margin:14px 0 6px;color:var(--pri)}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--bg)}
.item.on{background:var(--hl)}
.item input{width:20px;height:20px;margin-top:3px;flex:none}
.item .t{flex:1}.item small{display:block;color:var(--mute)}
.item .p{font-weight:600;white-space:nowrap}
.side{position:sticky;top:12px;align-self:start}
.side ol{padding-left:22px;margin:8px 0;max-height:42vh;overflow:auto}
.side li{margin-bottom:4px}.side li span{float:right}
.total{display:flex;justify-content:space-between;font-size:1.3rem;font-weight:700;border-top:2px solid var(--pri);padding-top:8px}
.btns{display:grid;gap:8px;margin-top:12px}
#print{display:none}
@media print{
 body{background:#fff;color:#000}
 header,.wrap{display:none}
 #print{display:block;padding:10mm}
 #print table{width:100%;border-collapse:collapse}
 #print th,#print td{border:1px solid #000;padding:5px 8px;text-align:left}
 #print td.r,#print th.r{text-align:right}
}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50}
#ov.on{display:flex}
.ovbox{margin:auto;width:min(720px,96vw);height:90vh;background:var(--card);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.ovb{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px}
#ovf{flex:1;background:#fff;color:#000;overflow:auto;width:100%;padding:8px}
#ovf img{max-width:100%;display:block}
</style>
</head>
<body>
<header><h1>🩺 รายการตรวจสุขภาพ – เลือกรายการและสรุปราคา</h1></header>
<div class="wrap">
 <main class="card">
  <div class="tools">
   <input type="search" id="q" placeholder="ค้นหารายการตรวจ...">
   <button class="sec" id="clr">ล้างทั้งหมด</button>
  </div>
  <div id="list"></div>
 </main>
 <aside class="side card">
  <label for="pn"><b>ชื่อผู้ตรวจ</b></label>
  <input type="text" id="pn" placeholder="ระบุชื่อ-นามสกุลผู้ตรวจ">
  <b>สรุปรายการที่เลือก (<span id="cnt">0</span>)</b>
  <ol id="sum"></ol>
  <div class="total"><span>ราคารวม</span><span><span id="tot">0</span> บาท</span></div>
  <div class="btns">
   <button id="bh">🖨️ พิมพ์ใบสรุป</button>
  </div>
 </aside>
</div>
<script>
const G=[
["การตรวจทางห้องปฏิบัติการ (Laboratory)",[
["ตรวจน้ำตาลสะสม (Hb A1C)","ตรวจน้ำตาลในเลือดย้อนหลัง 3 เดือน",350],
["ตรวจระดับแคลเซียมในเลือด (Calcium)","ภาวะกระดูกพรุน",200],
["ตรวจสารบ่งชี้มะเร็งตับ (AFP)","ตรวจคัดกรองหาสารก่อมะเร็งตับ",500],
["ตรวจสารบ่งชี้มะเร็งลำไส้ใหญ่ (CEA)","ตรวจคัดกรองหาสารก่อมะเร็งลำไส้",500],
["ตรวจสารบ่งชี้มะเร็งรังไข่ (CA12-5)","ตรวจคัดกรองหาสารก่อมะเร็งรังไข่",500],
["ตรวจสารบ่งชี้มะเร็งเต้านม (CA15-3)","ตรวจคัดกรองหาสารมะเร็งเต้านม",500],
["ตรวจสารบ่งชี้มะเร็งตับอ่อน (CA19-9)","ตรวจคัดกรองหาสารมะเร็งตับอ่อน",500],
["ตรวจสารบ่งชี้มะเร็งต่อมลูกหมาก PSA","ตรวจสารบ่งชี้มะเร็งต่อมลูกหมาก PSA",500],
["ตรวจการทำงานของต่อมธัยรอยด์","Free T3 / Free T4 / TSH",1000],
["ตรวจการทำงานของต่อมธัยรอยด์","T3/T4",300],
["ตรวจระดับน้ำดีในเลือด","Direct bilirubin / Total bilirubin (DBIL/TBIL)",300],
["ตรวจสมรรถภาพการทำงานของตับ","Albumin / Globulin / Total Protein",300],
["ตรวจสมรรถภาพการทำงานของตับ","GGT",150],
["ตรวจหาเชื้อไวรัสตับอักเสบ A","ตรวจหาเชื้อไวรัสตับอักเสบ A",1000],
["ตรวจหาเชื้อไวรัสตับอักเสบบี","ตรวจหาเชื้อไวรัสตับอักเสบบี",200],
["ตรวจหาภูมิคุ้มกันไวรัสตับอักเสบบี","ตรวจหาภูมิคุ้มกันไวรัสตับอักเสบบี",250],
["ตรวจหาเชื้อไวรัสตับอักเสบซี","Anti-HCV",700],
["ตรวจหาเชื้อกามโรค","VDRL",200],
["ตรวจหาเชื้อไวรัสเอดส์","HIV",400],
["ตรวจระดับฮอร์โมนเพศชาย","Testosterone",1000],
["ตรวจระดับฮอร์โมนเพศหญิง","Estradiol (E2)",1000],
["ตรวจหาอินซูลินในเลือด","Insulin",500],
["ตรวจหาโรคธาลัสซีเมีย","Hb Typing",1000],
["ตรวจเคลื่อนไฟฟ้าหัวใจ","EKG",300],
["small dense LDL","ตรวจวัดความเสี่ยงต่อโรคเส้นเลือดสมองตีบและเส้นเลือดหัวใจตีบ",500],
["ALP","ตรวจการทำงานของถุงน้ำดีในตับ",50],
["HDL / LDL (โปรแกรมต่ำกว่า 35 ปี ไม่มีในโปรแกรม)","ตรวจไขมันในเลือดชนิดดีและชนิดไม่ดี",200],
["วัคซีนไข้หวัดใหญ่ 3 สายพันธุ์ปัจจุบัน","วัคซีนไข้หวัดใหญ่ ของหน้า 2 สัปดาห์",500]
]],
["อัลตราซาวด์ (Ultrasound)",[
["U/S Upper Abdomen (ช่องท้องส่วนบน)","ตับ ไต ถุงน้ำดี ตับอ่อน ม้าม",900],
["U/S Lower Abdomen (ช่องท้องส่วนล่าง)","ต่อมลูกหมาก กระเพาะปัสสาวะ มดลูก รังไข่",900],
["U/S Whole Abdomen (ช่องท้องส่วนบนและส่วนล่าง ราคาพิเศษ)","ตรวจก้อนเนื้อและความผิดปกติในช่องท้องทั้งหมด",1500]
]]];
const fmt=n=>n.toLocaleString("th-TH");
const sel=new Set();let n=0;const all=[];
const list=document.getElementById("list");
G.forEach(([gt,items])=>{
 const h=document.createElement("h2");h.textContent=gt;list.appendChild(h);
 items.forEach(([name,desc,price])=>{
  const id=n++;all.push({id,name,desc,price});
  const d=document.createElement("label");d.className="item";d.dataset.id=id;
  d.innerHTML=`<input type="checkbox"><span class="t">${name}<small>${desc}</small></span><span class="p">${fmt(price)}</span>`;
  d.querySelector("input").onchange=e=>{e.target.checked?sel.add(id):sel.delete(id);upd()};
  list.appendChild(d);
 });
});
function chosen(){return all.filter(a=>sel.has(a.id))}
function total(){return chosen().reduce((s,a)=>s+a.price,0)}
function upd(){
 document.querySelectorAll(".item").forEach(e=>e.classList.toggle("on",sel.has(+e.dataset.id)));
 const c=chosen();
 document.getElementById("cnt").textContent=c.length;
 document.getElementById("sum").innerHTML=c.map(a=>`<li>${a.name}<span>${fmt(a.price)}</span></li>`).join("");
 document.getElementById("tot").textContent=fmt(total());
}
document.getElementById("q").oninput=e=>{
 const v=e.target.value.toLowerCase();
 document.querySelectorAll(".item").forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(v)?"":"none"});
};
document.getElementById("clr").onclick=()=>{sel.clear();document.querySelectorAll(".item input").forEach(i=>i.checked=false);upd()};
const pname=()=>document.getElementById("pn").value.trim();
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let DL=null;
(async()=>{try{DL=window.claude?await window.claude.use("downloads"):null}catch(e){DL=null}})();
async function saveFile(name,data,type){
 if(DL){try{await DL.save({filename:name,data})}catch(e){if(!e||e.code!=="declined")alert("บันทึกไฟล์ไม่สำเร็จ")}return}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function summaryBody(){
 const c=chosen();
 const dt=new Date().toLocaleDateString("th-TH",{year:"numeric",month:"long",day:"numeric"});
 const td='style="border:1px solid #000;padding:5px 8px;text-align:left"',tr='style="border:1px solid #000;padding:5px 8px;text-align:right"';
 return `<div style="font-family:Sarabun,Tahoma,'Noto Sans Thai',sans-serif;color:#000;background:#fff;padding:20px"><h2 style="margin:0 0 8px">ใบสรุปรายการตรวจและราคา</h2><p style="margin:0 0 10px">ชื่อผู้ตรวจ: <b>${esc(pname())||"........................................"}</b><br>วันที่ ${dt}</p><table style="width:100%;border-collapse:collapse;font-size:14px"><tr><th ${td}>#</th><th ${td}>รายการตรวจ</th><th ${td}>รายละเอียด</th><th ${tr}>ราคา (บาท)</th></tr>${c.map((a,i)=>`<tr><td ${td}>${i+1}</td><td ${td}>${a.name}</td><td ${td}>${a.desc}</td><td ${tr}>${fmt(a.price)}</td></tr>`).join("")}<tr><th colspan="3" ${tr}>รวมทั้งสิ้น (${c.length} รายการ)</th><th ${tr}>${fmt(total())}</th></tr></table></div>`;
}
async function render(){
 const h=document.createElement("div");
 h.style.cssText="position:fixed;left:-9999px;top:0;width:794px;background:#fff";
 h.innerHTML=summaryBody();document.body.appendChild(h);
 try{if(document.fonts)await document.fonts.ready;return await html2canvas(h,{scale:2,backgroundColor:"#fff"})}
 finally{h.remove()}
}
const ov=document.createElement("div");ov.id="ov";
ov.innerHTML='<div class="ovbox"><div class="ovb"><button id="ovi">🖼️ บันทึกเป็นรูปภาพ</button><button id="ovp">📄 บันทึกเป็น PDF</button><button id="ovx" class="sec">ปิด</button></div><div id="ovf"></div></div>';
document.body.appendChild(ov);
bh.onclick=()=>{if(!chosen().length){alert("กรุณาเลือกรายการก่อน");return}ovf.innerHTML=summaryBody();ov.classList.add("on")};
ovx.onclick=()=>ov.classList.remove("on");
const stamp=()=>"ใบสรุปรายการตรวจ"+(pname()?"_"+pname().replace(/[\\/:*?"<>|]/g,""):"");
ovi.onclick=async()=>{
 try{
  const cv=await render();
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  ovf.innerHTML='<p style="margin:0 0 6px;font-size:14px">แตะค้างที่รูปเพื่อบันทึก หรือแคปหน้าจอ</p><img alt="ใบสรุป" src="'+cv.toDataURL("image/png")+'">';
  await saveFile(stamp()+".png",await blob.arrayBuffer(),"image/png");
 }catch(e){alert("สร้างรูปภาพไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต")}
};
ovp.onclick=async()=>{
 try{
  const cv=await render();
  const J=window.jspdf.jsPDF,pdf=new J({unit:"mm",format:"a4"});
  const W=210,H=297,ih=cv.height*W/cv.width,img=cv.toDataURL("image/png");
  let y=0;pdf.addImage(img,"PNG",0,0,W,ih);
  for(let left=ih-H;left>0;left-=H){y-=H;pdf.addPage();pdf.addImage(img,"PNG",0,y,W,ih)}
  await saveFile(stamp()+".pdf",pdf.output("arraybuffer"),"application/pdf");
 }catch(e){alert("สร้าง PDF ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต")}
};
</script>
</body>
</html>
